gbt_threshold_label_issue_caller:
  alias: GBT Threshold Label Issue Caller
  description: Checks labeled Home Assistant threshold helpers using each helper's
    type and position, dispatches a semantic alert, and creates or clears one Spook
    Repairs issue per helper.
  mode: queued
  max: 10
  fields:
    threshold_label:
      name: Threshold label
      description: Choose a label whose threshold helpers all use the same alert state.
      required: true
      selector:
        label:
      default: monitor_temperature_v2
    problem_condition:
      name: Problem condition
      description: Plain-language issue rule, such as 'cat fountain water is below
        its limit' or 'reptile room temperature is outside its configured range'.
      required: false
      selector:
        text:
  sequence:
  - variables:
      label_members: '{{ label_entities(threshold_label) }}'
      bad_members: "{% set ns = namespace(ids=[]) %}\n{% for entity_id in label_entities(threshold_label)
        %}\n  {% set kind = state_attr(entity_id, 'type') %}\n  {% set pos = state_attr(entity_id,
        'position') %}\n  {% set bad = (kind == 'lower' and pos == 'below') or (kind
        == 'upper' and pos == 'above') or (kind == 'range' and pos in ['below', 'above'])
        %}\n  {% if bad %}{% set ns.ids = ns.ids + [entity_id] %}{% endif %}\n{% endfor
        %}\n{{ ns.ids }}"
      bad_count: "{% set ns = namespace(n=0) %}\n{% for entity_id in label_entities(threshold_label)
        %}\n  {% set kind = state_attr(entity_id, 'type') %}\n  {% set pos = state_attr(entity_id,
        'position') %}\n  {% if (kind == 'lower' and pos == 'below') or (kind == 'upper'
        and pos == 'above') or (kind == 'range' and pos in ['below', 'above']) %}\n
        \   {% set ns.n = ns.n + 1 %}\n  {% endif %}\n{% endfor %}\n{{ ns.n }}"
  - if:
    - condition: template
      value_template: '{{ bad_count | int(0) > 0 }}'
    then:
    - action: script.gbt_generic_semantic
      data:
        input_entities: '{{ bad_members }}'
        condition: '{{ problem_condition }}'
      response_variable: semantic_result
    - action: persistent_notification.create
      data:
        notification_id: threshold_label_test_{{ threshold_label }}
        title: TEST dispatch — {{ threshold_label }}
        message: '{{ semantic_result.text }}'
    else:
    - action: persistent_notification.dismiss
      data:
        notification_id: threshold_label_test_{{ threshold_label }}
  - repeat:
      for_each: '{{ label_members }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ repeat.item in bad_members }}'
          sequence:
          - action: repairs.create
            data:
              issue_id: threshold_{{ repeat.item | replace('.', '_') }}
              title: 'Threshold alert: {{ entity_name(repeat.item) }}'
              description: '{{ problem_condition }}. Current reading/report: {{ semantic_result.text
                }}'
              severity: warning
              persistent: true
        - conditions:
          - condition: template
            value_template: '{% set kind = state_attr(repeat.item, ''type'') %}

              {% set pos = state_attr(repeat.item, ''position'') %}

              {{ (kind == ''lower'' and pos == ''above'') or (kind == ''upper'' and
              pos == ''below'') or (kind == ''range'' and pos == ''in_range'') }}'
          sequence:
          - action: repairs.remove
            data:
              issue_id: threshold_{{ repeat.item | replace('.', '_') }}
          - action: repairs.remove
            data:
              issue_id: threshold_unavailable_{{ repeat.item | replace('.', '_') }}
        default:
        - action: repairs.remove
          data:
            issue_id: threshold_{{ repeat.item | replace('.', '_') }}
        - action: repairs.create
          data:
            issue_id: threshold_unavailable_{{ repeat.item | replace('.', '_') }}
            title: 'Cannot assess: {{ entity_name(repeat.item) }}'
            description: 'The threshold helper cannot currently be assessed. State:
              {{ states(repeat.item) }}; type: {{ state_attr(repeat.item, ''type'')
              }}; position: {{ state_attr(repeat.item, ''position'') }}.'
            severity: warning
            persistent: true
custom_alexa_notification_ui:
  alias: Alexa Custom Notification UI
  description: 'Send an Alexa announcement at a set volume, then restore the speaker''s
    previous volume. UI copy of the YAML Alexa Custom Notification without its quiet-hours
    logic: quiet hours and repeats are handled by Alert Redux (its loud Alexa notifier
    group holds lower-priority alerts overnight and re-announces unacknowledged ones).
    Called by notify.alexa_sound. If the message is about a currently firing Alert
    Redux alert, it is first rewritten into one short spoken sentence by GBT Generic
    Semantic (set semantic to false to skip); any failure falls back to the original
    message. Alert Redux done messages (stopped firing after ...) are treated as clear_notification
    so Alexa says nothing when an alert ends.'
  fields:
    local_mute:
      description: Mute for testing purposes. Global alexa mute entity is input_boolean.bool_mute_alexa_notifications
      name: Local Mute
      selector:
        select:
          options:
          - 'On'
          - 'Off'
    message:
      default: 'No message set. '
      name: Message
      required: true
      selector:
        text:
    sound:
      description: Be annoying!!
      name: Sound
      selector:
        select:
          options:
          - amzn_sfx_doorbell_chime_01
          - bell_02
          - buzzers_pistols_01
          - amzn_sfx_church_bell_1x_02
          - amzn_sfx_doorbell_01
          - amzn_sfx_doorbell_chime_01
          - amzn_sfx_doorbell_chime_02
          - christmas_05
          - horror_10
          - air_horn_03
          - boing_01
          - boing_03
          - camera_01
          - squeaky_12
          - clock_01
          - amzn_sfx_trumpet_bugle_04
          - amzn_sfx_cat_meow_1x_01
          - amzn_sfx_dog_med_bark_1x_02
          - amzn_sfx_lion_roar_02
          - amzn_sfx_rooster_crow_01
          - amzn_sfx_wolf_howl_02
          - futuristic_10
          - amzn_sfx_scifi_engines_on_02
          - amzn_sfx_scifi_alarm_04
          - amzn_sfx_scifi_sheilds_up_01
          - amzn_sfx_scifi_alarm_01
          - zap_01
          - amzn_sfx_crowd_applause_01
          - amzn_sfx_large_crowd_cheer_01
    target_alexa_speaker:
      default:
        entity_id: media_player.alexa_s_baby
      name: Alexa Speaker
      required: false
      selector:
        target:
          entity:
            domain: media_player
            integration: alexa_media
    volume:
      default: Normal Volume
      description: 'Speaker volume for the announcement: Maximum 1.0, Normal 0.65,
        or Current to leave it alone. The previous volume is restored afterwards.'
      name: Volume
      required: true
      selector:
        select:
          options:
          - Maximum Volume
          - Normal Volume
          - Current
    semantic:
      name: Semantic message
      description: On (default) rewrites alert messages about a firing Alert Redux
        threshold alert into one short spoken sentence via GBT Generic Semantic. Off
        speaks the message as given.
      required: false
      default: true
      selector:
        boolean:
  icon: mdi:bullhorn-outline
  sequence:
  - alias: Stay silent when an alert is fixed
    variables:
      message: '{{ ''clear_notification'' if ''stopped firing'' in (message | default('''',
        true)) else message }}'
  - alias: 'Semantic: find firing alerts this message is about'
    variables:
      sem_clear: '{{ ''clear_notification'' in (message | default('''', true)) }}'
      sem_targets: '{% set ns = namespace(ids=[]) %}{% set m = message | default('''',
        true) %}{% for a in states.alert_redux if a.attributes.get(''firing_since'')
        and a.attributes.get(''source_entity'') %}{% set h = a.attributes.source_entity
        %}{% set src = state_attr(h, ''entity_id'') %}{% set nm = state_attr(src,
        ''friendly_name'') if src else none %}{% if nm and nm in m %}{% set ns.ids
        = ns.ids + [h] %}{% endif %}{% endfor %}{{ ns.ids | unique | list }}'
  - alias: 'Semantic: ask for one short sentence'
    if:
    - condition: template
      value_template: '{{ (semantic | default(true)) | bool(true) and sem_targets
        | length > 0 and not sem_clear }}'
    then:
    - action: script.gbt_generic_semantic
      continue_on_error: true
      data:
        condition: 'Alert: {{ message }} Say it as ONE short spoken sentence: the
          sensor by its real name with its device and area, its current value, the
          limit it crossed, and how long it has been out of range if known. Do not
          use the alert name. If the message starts with Critical alert, begin your
          sentence with the words Critical alert. Otherwise no preamble.'
        input_entities: '{{ sem_targets }}'
      response_variable: semantic_result
  - alias: 'Semantic: use it, or keep the original message'
    variables:
      message: '{% if semantic_result is defined and (semantic_result.text | default('''',
        true) | length > 0) %}{{ semantic_result.text | trim | truncate(300, true,
        '''') }}{% else %}{{ message }}{% endif %}'
  - variables:
      bool_clear_message: '{{ bool((''clear_notification'' in message) ,false )}}'
      bool_local_mute: '{{  bool( ''Off'' if local_mute is not defined else bool(
        local_mute,false),false) }}'
      global_mute: '{{ bool(states(''input_boolean.bool_mute_alexa_notifications''),false)
        }}'
      message_real: '"{{ message | regex_replace(find=''(\\d+)\\s*g\\s+'', replace=''\\1
        gallon '', ignorecase=True) }}"

        '
      play_sound: '{{ false if sound is not defined or sound == ''no_sound'' else
        true }}'
      speaker_id: '{{ (target_alexa_speaker | default({''entity_id'': ''media_player.alexa_s_baby''})).entity_id
        }}'
      volume: '{{ volume | default(''Normal Volume'') }}'
    alias: Read inputs
  - alias: Derive mute, volume change and previous volume
    variables:
      bool_mute: '{{bool(( global_mute or local_mute ),false)}}'
      previous_volume: '{{ state_attr(speaker_id,''volume_level'') }}'
      do_volume_change: '{{ volume != ''Current'' }}'
  - alias: Derive announcement volume
    variables:
      volume_float: "{% if volume == 'Maximum Volume' %}\n  1.0\n{%- elif volume ==
        'Normal Volume' -%}\n  .65\n{%- else -%}\n  {{ previous_volume }}\n{%- endif
        %}"
  - alias: Clear the message if contains "clear_notification"
    else:
    - choose:
      - alias: If alexa is MUTED
        conditions:
        - condition: template
          value_template: '{{ bool(bool_mute,false )  }}'
        sequence:
        - action: logbook.log
          data:
            entity_id: '{{ speaker_id }}'
            message: 'Alexa was MUTED and is not allowed to say the following message,
              {{ message_real }} | Sound: {{play_sound}} {{ sound }} | Volume: {{volume_float}}
              | Prev Volume: {{previous_volume}}'
            name: Alexa Muted
          metadata: {}
      default:
      - alias: Set temporary vol
        enabled: true
        if:
        - condition: template
          value_template: '{{ bool(do_volume_change, false)}}'
        then:
        - action: media_player.volume_set
          data:
            volume_level: '{{ volume_float| float (0.5) }}'
          metadata: {}
          target:
            entity_id: '{{ speaker_id }}'
      - alias: play a sound!
        if:
        - condition: template
          value_template: '{{ bool(play_sound , false )}}'
        then:
        - action: media_player.play_media
          data:
            media_content_id: '{{ sound }}'
            media_content_type: sound
          target:
            entity_id: '{{ speaker_id }}'
      - action: notify.alexa_media
        alias: send notification, replace 'g' with gallon
        data:
          message: '{{message_real}}'
          target: '{{speaker_id}}'
        enabled: true
        metadata: {}
      - alias: play sound again
        if:
        - condition: template
          value_template: '{{ bool(play_sound , false )}}'
        then:
        - action: media_player.play_media
          data:
            media_content_id: '{{ sound }}'
            media_content_type: sound
          target:
            entity_id: '{{ speaker_id }}'
      - alias: Wait for Alexa to finish the sounds and speech
        if:
        - condition: template
          value_template: '{{ bool(do_volume_change, false) }}'
        then:
        - delay:
            seconds: '{{ [3 + (message_real | length / 12) | round(0, ''ceil'') +
              (10 if bool(play_sound, false) else 0), 45] | min | int }}'
      - alias: 'Restore orig. volume '
        if:
        - condition: template
          value_template: '{{ bool(do_volume_change, false)}}'
        then:
        - action: media_player.volume_set
          data:
            volume_level: '{{   previous_volume | float (0.5) }}'
          metadata: {}
          target:
            entity_id: '{{ speaker_id }}'
      - action: logbook.log
        data:
          entity_id: '{{ speaker_id }}'
          message: 'Alexa was dispatched to say the following message, {{ message_real
            }} | Sound: {{play_sound}} {{ sound }} | Volume: {{volume_float}} | Prev
            Volume: {{previous_volume}}'
          name: Alexa Notification Dispatched
        metadata: {}
    if:
    - condition: template
      value_template: '{{ bool( bool_clear_message,false)}}'
    then:
    - action: logbook.log
      data:
        entity_id: '{{ speaker_id }}'
        message: Alexa was MUTED bc the notification is being cleared.
        name: Alexa Clear_Notification
      metadata: {}
  mode: queued
  max: 10
