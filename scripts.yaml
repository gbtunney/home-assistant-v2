set_state_switch_light_test_version:
  alias: Set Entity State v3.0
  description: Turn on or off one or more entities. State source is either manual
    selection, mirrored from a reference entity, or inverted from a reference entity.
  icon: mdi:toggle-switch-off
  fields:
    target_entities:
      name: Target Entities
      description: One or more switch/light/input_boolean entities to control.
      required: true
      selector:
        entity:
          multiple: true
          domain:
          - switch
          - light
          - input_boolean
    mode:
      name: Mode
      description: 'How to determine the state to apply. Manual: use the State field.
        Mirror: copy state from the reference entity. Invert: apply the opposite of
        the reference entity''s state.'
      required: true
      default: manual
      selector:
        select:
          options:
          - label: Manual
            value: manual
          - label: Mirror reference entity
            value: mirror
          - label: Invert reference entity
            value: invert
    manual_state:
      name: State
      description: The state to apply. Only used when Mode is Manual.
      required: false
      default: 'off'
      selector:
        select:
          options:
          - label: 'On'
            value: 'on'
          - label: 'Off'
            value: 'off'
    reference_entity:
      name: Reference Entity
      description: Entity whose state is mirrored or inverted. Only used when Mode
        is Mirror or Invert.
      required: false
      selector:
        entity:
          domain:
          - binary_sensor
          - schedule
          - switch
          - light
          - input_boolean
  sequence:
  - variables:
      _mode: '{{ mode | default(''manual'') | lower }}'
      _target_list: "{%- if target_entities is string -%}\n  {{ [target_entities]
        }}\n{%- elif target_entities is iterable -%}\n  {{ target_entities | list
        }}\n{%- else -%}\n  {{ [] }}\n{%- endif -%}"
      _ref_id: '{{ reference_entity | default('''') }}'
      _ref_state: "{%- if _ref_id != '' and states(_ref_id) in ['on', 'off'] -%}\n
        \ {{ states(_ref_id) }}\n{%- else -%}\n  invalid\n{%- endif -%}"
      _resolved_state: "{%- if _mode == 'manual' -%}\n  {{ manual_state | default('off')
        | lower }}\n{%- elif _mode == 'mirror' -%}\n  {{ _ref_state }}\n{%- elif _mode
        == 'invert' -%}\n  {%- if _ref_state == 'on' -%}off\n  {%- elif _ref_state
        == 'off' -%}on\n  {%- else -%}invalid{%- endif -%}\n{%- else -%}\n  invalid\n{%-
        endif -%}"
      _valid: "{{\n  _resolved_state in ['on', 'off']\n  and _target_list | length
        > 0\n}}"
  - if:
    - condition: template
      value_template: '{{ not _valid }}'
    then:
    - action: logbook.log
      data:
        name: Set Entity State — SKIPPED
        message: Mode={{ _mode }}, resolved_state={{ _resolved_state }}, targets={{
          _target_list | join(', ') or 'none' }}, ref={{ _ref_id or 'none' }}, ref_state={{
          _ref_state }}
    - stop: Invalid inputs — action not called
      response_variable: result
  - repeat:
      for_each: '{{ _target_list }}'
      sequence:
      - variables:
          _entity: '{{ repeat.item }}'
          _domain: "{%- if '.' in _entity -%}\n  {{ _entity.split('.')[0] }}\n{%-
            else -%}\n  switch\n{%- endif -%}"
          _action: '{{ _domain }}.turn_{{ _resolved_state }}'
          _name: '{{ state_attr(_entity, ''friendly_name'') or _entity }}'
      - if:
        - condition: template
          value_template: '{{ is_state(_entity, [''on'', ''off'']) }}'
        then:
        - action: '{{ _action }}'
          target:
            entity_id: '{{ _entity }}'
        - action: logbook.log
          data:
            name: Set Entity State — {{ _resolved_state | upper }}
            message: Called {{ _action }} on {{ _name }} (mode={{ _mode }} {%- if
              _mode in ['mirror','invert'] %}, ref={{ _ref_id }}, ref_state={{ _ref_state
              }}{% endif %})
            entity_id: '{{ _entity }}'
        else:
        - action: logbook.log
          data:
            name: Set Entity State — SKIPPED entity
            message: '{{ _name }} ({{ _entity }}) is {{ states(_entity) }} — not on/off,
              skipping.'
  - variables:
      result:
        mode: '{{ _mode }}'
        resolved_state: '{{ _resolved_state }}'
        targets: '{{ _target_list }}'
        reference_entity: '{{ _ref_id or none }}'
        reference_state: '{{ _ref_state }}'
  - stop: Done
    response_variable: result
issue_queue_command:
  alias: Issue Queue Command
  mode: parallel
  sequence:
  - variables:
      queue: '{{ states(''input_text.issue_queue'') | from_json(default=[]) }}'
      cid: '{{ issue_id }}'
      idx: "{% set i = -1 %} {% for item in queue %}\n  {% if item.id == cid %}\n
        \   {% set i = loop.index0 %}\n  {% endif %}\n{% endfor %} {{ i }}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ command == ''create'' and idx == -1 }}'
      sequence:
      - variables:
          issue: "{{\n  {\n    \"id\": cid,\n    \"summary\": summary or cid,\n    \"details\":
            details or \"\",\n    \"active\": true,\n    \"tags\": tags or [],\n    \"updated\":
            now()\n  }\n}}\n"
          new_queue: '{{ queue + [issue] }}'
      - data:
          entity_id: input_text.issue_queue
          value: '{{ new_queue | to_json }}'
        action: input_text.set_value
      - event: issue_queue_event
        event_data:
          action: create
          issue: '{{ issue }}'
    - conditions:
      - condition: template
        value_template: '{{ command == ''update'' and idx != -1 }}'
      sequence:
      - variables:
          issue: "{{\n  queue[idx] | combine({\n    \"summary\": summary or queue[idx].summary,\n
            \   \"details\": details or queue[idx].details,\n    \"tags\": tags or
            queue[idx].tags,\n    \"updated\": now()\n  })\n}}\n"
          new_queue: '{{ queue[:idx] + [issue] + queue[idx+1:] }}'
      - data:
          entity_id: input_text.issue_queue
          value: '{{ new_queue | to_json }}'
        action: input_text.set_value
      - event: issue_queue_event
        event_data:
          action: update
          issue: '{{ issue }}'
    - conditions:
      - condition: template
        value_template: '{{ command == ''resolve'' and idx != -1 }}'
      sequence:
      - variables:
          issue: "{{\n  queue[idx] | combine({\n    \"active\": false,\n    \"updated\":
            now()\n  })\n}}\n"
          new_queue: '{{ queue[:idx] + [issue] + queue[idx+1:] }}'
      - data:
          entity_id: input_text.issue_queue
          value: '{{ new_queue | to_json }}'
        action: input_text.set_value
      - event: issue_queue_event
        event_data:
          action: resolve
          issue: '{{ issue }}'
    - conditions:
      - condition: template
        value_template: '{{ command == ''remove'' and idx != -1 }}'
      sequence:
      - variables:
          new_queue: '{{ queue | rejectattr(''id'',''equalto'',cid) | list }}'
      - data:
          entity_id: input_text.issue_queue
          value: '{{ new_queue | to_json }}'
        action: input_text.set_value
      - event: issue_queue_event
        event_data:
          action: remove
          id: '{{ cid }}'
    - conditions:
      - condition: template
        value_template: '{{ command == ''exists'' }}'
      sequence:
      - event: issue_queue_event
        event_data:
          action: exists
          exists: '{{ idx != -1 }}'
          active: '{{ idx != -1 and queue[idx].active }}'
  - action: input_text.set_value
    metadata: {}
    target:
      entity_id: input_text.issue_queue
    data:
      value: 'i am a value '
  description: ''
  fields:
    field:
      selector:
        text:
      default: hello
    field_2:
      selector:
        text:
    command:
      name: Command
      description: Queue operation
      required: true
      selector:
        select:
          options:
          - create
          - update
          - resolve
          - remove
          - exists
    issue_id:
      selector:
        text:
      name: Issue ID
      description: 'this is a test '
      required: true
    summary:
      selector:
        text:
      name: summary
    details:
      selector:
        text:
          multiline: true
      name: Details
issue_wueue_2:
  alias: Issue Queue 2
  description: Maintain a JSON issue queue stored in input_text.issue_queue
  mode: queued
  fields:
    action:
      name: Action
      description: add | update | remove | clear | list
      required: true
      selector:
        select:
          options:
          - add
          - update
          - remove
          - clear
          - list
    issue_id:
      name: Issue ID
      description: Unique issue identifier
      required: false
      selector:
        text:
          multiline: false
    summary:
      name: Summary
      required: false
      selector:
        text:
          multiline: false
    details:
      name: Details
      required: false
      selector:
        text:
          multiline: true
    severity:
      name: Severity
      required: false
      selector:
        select:
          options:
          - low
          - medium
          - high
          - critical
  variables:
    queue_entity: input_text.issue_queue
    queue_raw: '{{ states(queue_entity) | default(''[]'', true) }}'
    queue: "{% set s = queue_raw | trim %} {% if s in ['unknown', 'unavailable', 'none',
      ''] %}\n  []\n{% else %}\n  {{ s | from_json }}\n{% endif %}\n"
    v_action: '{{ action | default('''', true) | lower }}'
    v_issue_id: '{{ issue_id | default('''', true) | trim }}'
    v_summary: '{{ summary | default('''', true) | trim }}'
    v_details: '{{ details | default('''', true) | trim }}'
    v_severity: '{{ severity | default('''', true) | lower }}'
    now_iso: '{{ now().isoformat() }}'
    incoming_issue: '{% set obj = dict(issue_id=v_issue_id, updated_at=now_iso) %}
      {% if v_summary != '''' %}{% set obj = dict(obj, summary=v_summary) %}{% endif
      %} {% if v_details != '''' %}{% set obj = dict(obj, details=v_details) %}{%
      endif %} {% if v_severity != '''' %}{% set obj = dict(obj, severity=v_severity)
      %}{% endif %} {{ obj }}

      '
    existing_index: "{% set idx = -1 %} {% for item in queue %}\n  {% if item is mapping
      and (item.get('issue_id','') == v_issue_id) %}\n    {% set idx = loop.index0
      %}\n  {% endif %}\n{% endfor %} {{ idx }}\n"
    new_queue: "{% if v_action == 'clear' %}\n  []\n{% elif v_action == 'list' %}\n
      \ {{ queue }}\n{% elif v_action in ['add','update','remove'] %}\n  {% if v_issue_id
      == '' %}\n    {{ queue }}\n  {% else %}\n    {% if v_action == 'remove' %}\n
      \     {{ queue | rejectattr('issue_id', 'equalto', v_issue_id) | list }}\n    {%
      elif v_action == 'add' %}\n      {% if existing_index | int >= 0 %}\n        {{
      queue }}\n      {% else %}\n        {{ queue + [incoming_issue] }}\n      {%
      endif %}\n    {% elif v_action == 'update' %}\n      {% if existing_index |
      int < 0 %}\n        {{ queue + [incoming_issue] }}\n      {% else %}\n        {%
      set out = [] %}\n        {% for item in queue %}\n          {% if loop.index0
      == (existing_index | int) %}\n            {% set merged = dict(item, **incoming_issue)
      %}\n            {% set out = out + [merged] %}\n          {% else %}\n            {%
      set out = out + [item] %}\n          {% endif %}\n        {% endfor %}\n        {{
      out }}\n      {% endif %}\n    {% endif %}\n  {% endif %}\n{% else %}\n  {{
      queue }}\n{% endif %}\n"
    should_write: '{{ v_action in [''add'',''update'',''remove'',''clear''] }}'
    affected_issue: "{% if v_issue_id == '' %}\n  {{ dict() }}\n{% else %}\n  {% for
      item in new_queue %}\n    {% if item is mapping and item.get('issue_id','')
      == v_issue_id %}\n      {{ item }}\n      {% break %}\n    {% endif %}\n  {%
      endfor %}\n{% endif %}\n"
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ v_action in [''add'',''update'',''remove''] and v_issue_id
          == '''' }}'
      sequence:
      - event: issue_queue_event
        event_data:
          action: error
          error: missing_issue_id
          message: issue_id is required for add/update/remove
      - stop: missing issue_id
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ should_write }}'
      sequence:
      - action: input_text.set_value
        target:
          entity_id: '{{ queue_entity }}'
        data:
          value: '{{ new_queue | to_json }}'
  - event: issue_queue_event
    event_data:
      action: '{{ v_action }}'
      issue_id: '{{ v_issue_id }}'
      issue: '{{ affected_issue | default({}, true) }}'
      queue_length: '{{ new_queue | length }}'
      queue: '{{ new_queue }}'
function_natural_language_date:
  sequence:
  - variables:
      result:
        natural_date: NOT SET
  - variables:
      here_is_test: '{{result.natural_date}}'
  - action: pyscript.format_natural_date
    metadata: {}
    data:
      date_and_time: '{{ date_and_time }}'
    response_variable: result
  - variables:
      here_is_test: '{{result.natural_date}}'
  - stop: Script is complete
    response_variable: result
  alias: Function - Natural Language Date
  description: ''
  fields:
    date_and_time:
