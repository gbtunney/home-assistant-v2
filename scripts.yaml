      task_name: Semantic State Report
      instructions: 'Optional problem condition:

        {{ condition | default('''', true) }}


        Entity information:

        {{ entity_result }}


        Turn this entity information into a concise, natural, speech-friendly status
        report.

        Use friendly names, areas, and labels to identify equipment clearly. Group
        related entities by area or device and avoid repetition.

        Report current states neutrally; “off” is not inherently a problem.

        Only use alert wording when a non-empty, explicit problem condition was supplied.
        Otherwise, summarize the current states neutrally.

        Describe unknown or unavailable states accurately. Do not infer that everything
        is healthy just because no problem condition was supplied. Do not invent causes,
        thresholds, or statuses.

        Return only the report text, with no heading, markdown, or extra explanation.'
      entity_id: ai_task.openai_ai_task
    response_variable: result
    enabled: true
  - stop: Return generated report
    response_variable: result
  fields:
    condition:
      selector:
        text:
      name: Condition
      required: false
    input_entities:
      selector:
        entity:
          multiple: true
      description: Entity to describe for the ai
      name: Input Entities
      required: true
  alias: GBT Generic Semantic
  description: ''
gbt_threshold_label_issue_caller:
  alias: GBT Threshold Label Issue Caller
  description: Checks labeled Home Assistant threshold helpers using each helper's
    type and position, dispatches a semantic alert, and creates or clears one Spook
    Repairs issue per helper.
  mode: queued
  max: 10
  fields:
    threshold_label:
      name: Threshold label
      description: Choose a label whose threshold helpers all use the same alert state.
      required: true
      selector:
        label: {}
      default: monitor_temperature_v2
    problem_condition:
      name: Problem condition
      description: Plain-language issue rule, such as 'cat fountain water is below
        its limit' or 'reptile room temperature is outside its configured range'.
      required: false
      selector:
        text: {}
  sequence:
  - variables:
      label_members: '{{ label_entities(threshold_label) }}'
      bad_members: "{% set ns = namespace(ids=[]) %}\n{% for entity_id in label_entities(threshold_label)
        %}\n  {% set lower = state_attr(entity_id, 'lower') %}\n  {% set upper = state_attr(entity_id,
        'upper') %}\n  {% set state = states(entity_id) %}\n  {% set has_limits =
        lower is not none or upper is not none %}\n  {% set is_range = lower is not
        none and upper is not none %}\n  {% set bad = has_limits and ((is_range and
        state == 'off') or (not is_range and state == 'on')) %}\n  {% if bad %}{%
        set ns.ids = ns.ids + [entity_id] %}{% endif %}\n{% endfor %}\n{{ ns.ids }}"
      bad_count: "{% set ns = namespace(n=0) %}\n{% for entity_id in label_entities(threshold_label)
        %}\n  {% set lower = state_attr(entity_id, 'lower') %}\n  {% set upper = state_attr(entity_id,
        'upper') %}\n  {% set state = states(entity_id) %}\n  {% set has_limits =
        lower is not none or upper is not none %}\n  {% set is_range = lower is not
        none and upper is not none %}\n  {% if has_limits and ((is_range and state
        == 'off') or (not is_range and state == 'on')) %}\n    {% set ns.n = ns.n
        + 1 %}\n  {% endif %}\n{% endfor %}\n{{ ns.n }}"
  - if:
    - condition: template
      value_template: '{{ bad_count | int(0) > 0 }}'
    then:
    - action: script.gbt_generic_semantic
      data:
        input_entities: '{{ bad_members }}'
        condition: '{{ problem_condition }}'
      response_variable: semantic_result
    - action: persistent_notification.create
      data:
        notification_id: threshold_label_test_{{ threshold_label }}
        title: TEST dispatch — {{ threshold_label }}
        message: '{{ semantic_result.data }}'
    else:
    - action: persistent_notification.dismiss
      data:
        notification_id: threshold_label_test_{{ threshold_label }}
  - repeat:
      for_each: '{{ label_members }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ repeat.item in bad_members }}'
          sequence:
          - action: repairs.create
            data:
              issue_id: threshold_{{ repeat.item | replace('.', '_') }}
              title: 'Threshold alert: {{ entity_name(repeat.item) }}'
              description: '{{ problem_condition }}. Current reading/report: {{ semantic_result.data
                }}'
              severity: warning
              persistent: true
        - conditions:
          - condition: template
            value_template: '{% set lower = state_attr(repeat.item, ''lower'') %}

              {% set upper = state_attr(repeat.item, ''upper'') %}

              {% set state = states(repeat.item) %}

              {% set has_limits = lower is not none or upper is not none %}

              {% set is_range = lower is not none and upper is not none %}

              {{ has_limits and ((is_range and state == ''on'') or (not is_range and
              state == ''off'')) }}'
          sequence:
          - action: repairs.remove
            data:
              issue_id: threshold_{{ repeat.item | replace('.', '_') }}
          - action: repairs.remove
            data:
              issue_id: threshold_unavailable_{{ repeat.item | replace('.', '_') }}
        default:
        - action: repairs.remove
          data:
            issue_id: threshold_{{ repeat.item | replace('.', '_') }}
        - action: repairs.create
          data:
            issue_id: threshold_unavailable_{{ repeat.item | replace('.', '_') }}
            title: 'Cannot assess: {{ entity_name(repeat.item) }}'
            description: 'The threshold helper cannot currently be assessed. State:
              {{ states(repeat.item) }}; type: {{ state_attr(repeat.item, ''type'')
              }}; position: {{ state_attr(repeat.item, ''position'') }}.'
            severity: warning
            persistent: true
critical_alert_semantic_entity_test:
  alias: Critical Alert — Semantic Entity References (TEST)
  description: Manual test for an Alert Redux generator. Returns semantic text and
    exact entity references; only creates a local test notification when requested.
    Does not fire alerts or send mobile critical notifications.
  mode: queued
  max: 5
  fields:
    generator_entity:
      name: Generator
      default: sensor.alert_redux_generator_test_label_wip
      selector:
        entity:
          domain: sensor
    input_entities:
      name: Override entity references
      description: Optional explicit subjects for testing; otherwise uses currently
        firing generated alerts.
      selector:
        entity:
          multiple: true
    create_notification:
      name: Create local test notification
      default: false
      selector:
        boolean:
  sequence:
  - variables:
      generator: '{{ generator_entity | default(''sensor.alert_redux_generator_test_label_wip'',true)
        }}'
  - variables:
      alert_ids: '{{ state_attr(generator,''alerts'') | default([],true) }}'
      all_targets: '{{ state_attr(generator,''targets'') | default([],true) }}'
  - variables:
      firing_alerts: '{{ expand(alert_ids) | selectattr(''state'',''in'',[''active'',''ack''])
        | map(attribute=''entity_id'') | list }}'
  - variables:
      subjects: '{{ input_entities | default(expand(firing_alerts) | map(attribute=''attributes.subject_entity'')
        | select(''string'') | unique | list, true) }}'
      semantic_result: {}
      fallback: '{% if not has_value(generator) %}Generator data is unavailable; no
        conclusion about equipment health can be made.{% elif firing_alerts | count
        == 0 %}No currently firing alerts were found in this generator.{% else %}Currently
        firing alert subjects: {{ subjects | join('', '') }}.{% endif %}'
  - if:
    - condition: template
      value_template: '{{ subjects | count > 0 }}'
    then:
    - action: script.gbt_generic_semantic
      data:
        input_entities: '{{ subjects }}'
        condition: '{% if input_entities | default([],true) | count > 0 %}Manual test
          of these entities. Describe their current states without inferring a fault.{%
          else %}These entities are subjects of currently firing Alert Redux alerts.
          {% for id in firing_alerts %}{{ state_attr(id,''message'') | default(id,true)
          }} {% endfor %}Do not infer a physical cause from the alert name alone.{%
          endif %}'
      response_variable: semantic_result
      continue_on_error: true
  - variables:
      report: '{{ semantic_result.data | default(fallback,true) }}'
      references: '{% set ns=namespace(rows=[]) %}{% for id in subjects %}{% set ns.rows
        = ns.rows + [dict(entity_id=id,name=state_attr(id,''friendly_name'') | default(id,true),state=states(id),area=area_name(id),labels=labels(id))]
        %}{% endfor %}{{ ns.rows }}'
      reference_text: '{% for id in subjects %}

        - {{ state_attr(id,''friendly_name'') | default(id,true) }} — `{{ id }}` ({{
        states(id) }}){% endfor %}'
  - variables:
      result:
        message: '{{ report }}'
        entities: '{{ subjects }}'
        references: '{{ references }}'
        generator: '{{ generator }}'
        alerts: '{{ firing_alerts }}'
        all_targets: '{{ all_targets }}'
  - if:
    - condition: template
      value_template: '{{ create_notification | default(false) | bool }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: critical_alert_semantic_entity_test
        title: TEST — Critical alert with entity references
        message: '{{ report }}


          Entity references:

          {{ reference_text }}'
  - stop: Return semantic report and exact entity references
    response_variable: result
