  - action: extended_openai_conversation.query_image
    metadata: {}
    data:
      images: []
      max_tokens: 300
      config_entry: 01JETKDY6JSNVZJNREFAM115J0
      prompt: 'hello say hi if u gwt this no i afes

        '
    response_variable: result
  - action: homeassistant.create_floor
    metadata: {}
    data: {}
  description: ''
llv_numeric_question:
