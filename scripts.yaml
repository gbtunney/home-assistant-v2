api_adapter_notification_dispatcher:
  sequence:
  - alias: Set up variables
    variables:
      target_notification_channel: '{{notification_channel_list.split('','') }}'
      notification_channel_count: '{{target_notification_channel |  list | count }}'
      action_callback: '{{callback}}'
    enabled: false
  - action: script.notification_dispatcher
    metadata: {}
    data:
      message: '{{message}}'
      notification_channel:
      - persistant
      - alexa
      alexa_sound: amzn_sfx_doorbell_01
  mode: restart
  alias: API Adapter Notification Dispatcher
  description: ''
  fields: {}
tv_remote_volume_2:
  sequence:
  - variables:
      cmd: '{{ "VolumeUp" if ( command is not defined ) else command }}'
      value: '{{ ( states(''input_number.tv_remote_volume'') | int )  if ( units is
        not defined ) else ( units | int )}}'
  - action: remote.send_command
    metadata: {}
    data:
      num_repeats: '{{value}}'
      command: '{{cmd}}'
      device: TV
      delay_secs: 0.4
    target:
      entity_id: remote.infrared_rf_remote_control
  fields:
    command:
      selector:
        select:
          options:
          - VolumeUp
          - VolumeDown
      name: Command
      default: VolumeUp
    units:
      selector:
        number:
          min: 1
          max: 12
          step: 1
      name: Units
  alias: TV Remote Volume
  description: ''
set_state_switch_light_test_version:
  alias: Set Entity State v3.0
  description: 'Turn one or more entities on or off. State comes from a manual choice,
    or mirrors/inverts a reference entity. Targets in ''unknown'' still get the command;
    ''unavailable'' ones are skipped. Each target is checked after the command. Every
    failure is logged to Activity. Optional: raise a Spook repair per failure (clears
    itself on the next success), and Fail on error ends the run with an error after
    every target has been tried.'
  fields:
    target_entities:
      description: One or more switch/light/input_boolean entities to control.
      name: Target Entities
      required: true
      selector:
        entity:
          domain:
          - switch
          - light
          - input_boolean
          multiple: true
    mode:
      default: manual
      description: 'How to determine the state to apply. Manual: use the State field.
        Mirror: copy state from the reference entity. Invert: apply the opposite of
        the reference entity''s state.'
      name: Mode
      required: true
      selector:
        select:
          options:
          - label: Manual
            value: manual
          - label: Mirror reference entity
            value: mirror
          - label: Invert reference entity
            value: invert
    manual_state:
      default: 'off'
      description: The state to apply. Only used when Mode is Manual.
      name: State
      required: false
      selector:
        select:
          options:
          - label: 'On'
            value: 'on'
          - label: 'Off'
            value: 'off'
    reference_entity:
      description: Entity whose state is mirrored or inverted. Only used when Mode
        is Mirror or Invert.
      name: Reference Entity
      required: false
      selector:
        entity:
          domain:
          - binary_sensor
          - schedule
          - switch
          - light
          - input_boolean
    fail_on_error:
      default: false
      description: 'On: if inputs are invalid or any target doesn''t end up in the
        right state, the run ends with an error (after trying every target) so the
        calling automation sees it fail. Off: log it and keep going.'
      name: Fail on error
      required: false
      selector:
        boolean:
    raise_repair:
      default: false
      description: Also raise a Spook repair issue for each failure. One issue per
        entity, cleared automatically the next time this script sets that entity successfully
        with this option on.
      name: Raise repair issue
      required: false
      selector:
        boolean:
  icon: mdi:toggle-switch-off
  max: 10
  mode: queued
  sequence:
  - variables:
      _mode: '{{ mode | default(''manual'') | lower }}'
      _target_list: "{%- if target_entities is string -%}\n  {{ [target_entities]
        }}\n{%- elif target_entities is iterable -%}\n  {{ target_entities | list
        }}\n{%- else -%}\n  {{ [] }}\n{%- endif -%}"
      _ref_id: '{{ reference_entity | default('''') }}'
      _ref_state: "{%- if _ref_id != '' and states(_ref_id) in ['on', 'off'] -%}\n
        \ {{ states(_ref_id) }}\n{%- else -%}\n  invalid\n{%- endif -%}"
      _resolved_state: "{%- if _mode == 'manual' -%}\n  {{ manual_state | default('off')
        | lower }}\n{%- elif _mode == 'mirror' -%}\n  {{ _ref_state }}\n{%- elif _mode
        == 'invert' -%}\n  {%- if _ref_state == 'on' -%}off\n  {%- elif _ref_state
        == 'off' -%}on\n  {%- else -%}invalid{%- endif -%}\n{%- else -%}\n  invalid\n{%-
        endif -%}"
      _valid: "{{\n  _resolved_state in ['on', 'off']\n  and _target_list | length
        > 0\n}}"
      _strict: '{{ fail_on_error | default(false) | bool }}'
      _repair: '{{ raise_repair | default(false) | bool }}'
      _failures: []
  - if:
    - condition: template
      value_template: '{{ not _valid }}'
    then:
    - action: logbook.log
      data:
        message: Invalid inputs, nothing sent. Mode={{ _mode }}, resolved_state={{
          _resolved_state }}, targets={{ _target_list | join(', ') or 'none' }}, ref={{
          _ref_id or 'none' }}{% if _ref_id %} ({{ states(_ref_id) }}){% endif %}.
          {{ 'Failing the run.' if _strict else 'Stopping quietly.' }}
        name: Set Entity State — FAILED
    - if:
      - condition: template
        value_template: '{{ _repair }}'
      then:
      - action: repairs.create
        continue_on_error: true
        data:
          description: 'Nothing was sent to {{ _target_list | join('', '') or ''any
            entity'' }}.


            {% if _mode in [''mirror'', ''invert''] %}The reference `{{ _ref_id or
            ''not set'' }}` was **{{ states(_ref_id) if _ref_id else ''not set'' }}**,
            so there was no on/off to {{ _mode }}.{% else %}Mode `{{ _mode }}` resolved
            to `{{ _resolved_state }}`.{% endif %}


            Last seen {{ now().strftime(''%b %-d %H:%M'') }}. Clears itself the next
            time a run with this reference succeeds.'
          issue_id: set_entity_state_invalid_{{ (_ref_id or 'no_reference') | replace('.',
            '_') }}
          persistent: true
          severity: warning
          title: 'Set Entity State: nothing sent (invalid inputs)'
    - variables:
        result:
          mode: '{{ _mode }}'
          reason: invalid inputs
          reference_entity: '{{ _ref_id or none }}'
          reference_state: '{{ _ref_state }}'
          resolved_state: '{{ _resolved_state }}'
          skipped: true
          targets: '{{ _target_list }}'
    - if:
      - condition: template
        value_template: '{{ _strict }}'
      then:
      - error: true
        stop: Invalid inputs — nothing sent
    - response_variable: result
      stop: Invalid inputs — nothing sent
  - repeat:
      for_each: '{{ _target_list }}'
      sequence:
      - variables:
          _entity: '{{ repeat.item }}'
          _domain: "{%- if '.' in _entity -%}\n  {{ _entity.split('.')[0] }}\n{%-
            else -%}\n  switch\n{%- endif -%}"
          _action: '{{ _domain }}.turn_{{ _resolved_state }}'
          _name: '{{ state_attr(_entity, ''friendly_name'') or _entity }}'
          _entity_state: '{{ states(_entity) }}'
          _issue_id: set_entity_state_{{ _entity | replace('.', '_') }}
      - if:
        - condition: template
          value_template: '{{ _entity_state != ''unavailable'' }}'
        then:
        - action: '{{ _action }}'
          continue_on_error: true
          target:
            entity_id: '{{ _entity }}'
        - continue_on_timeout: true
          timeout: 00:00:10
          wait_template: '{{ is_state(_entity, _resolved_state) }}'
      - variables:
          _fail_reason: "{%- if _entity_state == 'unavailable' -%}\n  it was unavailable,
            so the command wasn't sent\n{%- else -%}\n  sent {{ _action }} but it
            was still {{ states(_entity) }} after 10 s\n{%- endif -%}"
          _ok: '{{ is_state(_entity, _resolved_state) }}'
      - else:
        - variables:
            _failures: '{{ _failures + [_entity] }}'
        - action: logbook.log
          data:
            entity_id: '{{ _entity }}'
            message: '{{ _name }} didn''t turn {{ _resolved_state }}: {{ _fail_reason
              }}. {{ ''The run will end with an error.'' if _strict else ''Continuing
              with the rest.'' }}'
            name: Set Entity State — FAILED
        - if:
          - condition: template
            value_template: '{{ _repair }}'
          then:
          - action: repairs.create
            continue_on_error: true
            data:
              description: '**{{ _name }}** (`{{ _entity }}`): {{ _fail_reason }}.


                Mode `{{ _mode }}`{% if _ref_id %}, reference `{{ _ref_id }}` = {{
                states(_ref_id) }}{% endif %}. Last seen {{ now().strftime(''%b %-d
                %H:%M'') }}.


                Clears itself the next time Set Entity State sets this entity successfully
                with repairs on.'
              issue_id: '{{ _issue_id }}'
              persistent: true
              severity: warning
              title: Set Entity State couldn't turn {{ _name }} {{ _resolved_state
                }}
        if:
        - condition: template
          value_template: '{{ _ok }}'
        then:
        - action: logbook.log
          data:
            entity_id: '{{ _entity }}'
            message: Set {{ _name }} {{ _resolved_state }} (was {{ _entity_state }},
              mode={{ _mode }} {%- if _mode in ['mirror','invert'] %}, ref={{ _ref_id
              }}, ref_state={{ _ref_state }}{% endif %})
            name: Set Entity State — {{ _resolved_state | upper }}
        - if:
          - condition: template
            value_template: '{{ _repair }}'
          then:
          - action: repairs.remove
            continue_on_error: true
            data:
              issue_id: '{{ _issue_id }}'
  - if:
    - condition: template
      value_template: '{{ _repair and _ref_id != '''' }}'
    then:
    - action: repairs.remove
      continue_on_error: true
      data:
        issue_id: set_entity_state_invalid_{{ _ref_id | replace('.', '_') }}
  - variables:
      result:
        failures: '{{ _failures }}'
        mode: '{{ _mode }}'
        reference_entity: '{{ _ref_id or none }}'
        reference_state: '{{ _ref_state }}'
        resolved_state: '{{ _resolved_state }}'
        targets: '{{ _target_list }}'
  - if:
    - condition: template
      value_template: '{{ _strict and _failures | length > 0 }}'
    then:
    - error: true
      stop: One or more targets failed — see Activity
  - response_variable: result
    stop: Done
event_dump_tester:
  sequence:
  - variables:
      start: '{{now() if start_time is not defined else start_time}}'
      end: '{{now() - timedelta(days=1)}}'
      format_result_start: NOT SET
      format_result_end: NOT SET
      response:
  - action: pyscript.format_natural_date
    metadata: {}
    data:
      date_and_time: '{{start}}'
    response_variable: format_result_start
    alias: FOrmat Start
  - action: pyscript.format_natural_date
    metadata: {}
    data:
      date_and_time: '{{end}}'
    response_variable: format_result_end
    alias: FOrmat end
  - action: pyscript.get_events_range
    metadata: {}
    data:
      entity_id: calendar.target_work
      start_time: '{{start}}'
      end_time: '{{end}}'
    response_variable: response
  - repeat:
      for_each: '{{ response.events }}'
      sequence:
      - variables:
          event: '{{ repeat.item }}'
          item_dump: '{{ repeat.item  | tojson }}'
      - action: logbook.log
        data:
          name: Event
          message: '{{ event.title }} — {{ event.start_local }}

            '
  fields:
    start_time:
      selector:
        datetime:
      required: false
      name: Start Time
      description: Beginning of range. Defaults to now.
    end_time:
      selector:
        datetime:
      name: End Time
      required: false
      description: End of range. Defaults to 7 days from now.
  alias: Event Dump Tester
  description: ''
bambu_printer_progress_reporter:
  sequence:
  - variables:
      sorted_milestone_list: todo
  alias: Bambu Printer Progress Reporter
  description: This should become a generic milestone reporter
  fields:
    current_value:
      selector:
        number:
          min: 1
          max: 100
      default: 62
      name: Current Value
    milestones:
      selector:
        text:
          multiple: true
      default:
      - '20'
      - '40'
      - '60'
      - '80'
      - '90'
    milestone_sort_order:
      selector:
        select:
          options:
          - ASC
          - DSC
      default: ASC
      name: Milestone Sort Order
    threshold_a:
      selector:
        number:
          min: -1000
          max: 1000
          step: 1
      default: 0
      name: Threshold A
    threshold_b:
      selector:
        number:
          min: -1000
          max: 1000
          step: 1
      default: 100
      name: Threshold B
semantic_entity_message_duplicate:
  sequence:
  - variables:
      device_info_response:
      device_router_data: device_router
      report_result:
    enabled: true
  - alias: Get Entity Info
    action: pyscript.entity_info
    data:
      flatten_members: 'false'
      dedupe: 'true'
      devices:
      - '{{ device_router }}'
    response_variable: device_info_response
    enabled: true
  - alias: Set Entity Info Variables
    variables:
      condition: unexpectedly off
      entity_info: '{{ entity_info_response }}'
    enabled: false
  - alias: Generate Semantic Message
    action: ai_task.generate_data
    data:
      task_name: Home Assistant spoken alert renderer
      instructions: '.Device information:

        {{ device_info_response | string }}

        Generate a concise status report for the supplied device information...'
    response_variable: generated_message
    enabled: false
  - action: ai_task.generate_data
    data:
      entity_id: ai_task.openai_ai_task_2
      task_name: Greeting
      instructions: 'Device information:{{ device_info_response | string }} Generate
        a concise status report for the supplied device information.


        Check my Home Assistant internet outage history for the last 7 days. Show
        current WAN status and a table of each disconnection with its start, recovery
        time, and duration in Buffalo local time. Include total downtime, distinguish
        missing data from confirmed outages, and compare against external ping monitoring
        if available.'
    enabled: true
    response_variable: device_info_response
  - action: logbook.log
    metadata: {}
    data:
      name: Teat
      message: Here is answer {{device_info_response}}
  - action: script.entity_dump
    metadata: {}
    data:
      input_entities:
      - input_number.10g_f_temperature
      - binary_sensor.ps_6_status
  alias: Wan Report
  description: Collects raw pyscript.entity_info output and exposes it with the condition
    for trace/debugging.
  mode: parallel
  max: 10
  fields:
    device_router:
      selector:
        device:
          filter:
          - integration: netgear
      default: b5fe8030195a7438b8c864fd4f831195
      name: Router Integration
      required: true
entity_dump:
  sequence:
  - variables:
      entity_info: "{% set entities = [input_entities]\n   if input_entities is string
        else input_entities %}\n{% set ns = namespace(results=[]) %}\n{% for entity
        in entities %}\n  {% set item = states[entity] %}\n  {% set entry = config_entry_id(entity)
        %}\n\n  \n  {% set ns.results = ns.results + [{\n    \"entity_id\": entity,\n
        \   \"exists\": item is not none,\n    \"name\": state_attr(entity, 'friendly_name'),\n
        \   \"state\": states(entity),\n    \"integration\": {\n      \"domain\":
        config_entry_attr(entry, 'domain') if entry else none,\n      \"title\": config_entry_attr(entry,
        'title') if entry else none,\n      \"config_entry_id\": entry\n    },\n    \"metadata\":
        {\n      \"last_changed\": item.last_changed.isoformat()\n                      if
        item is not none else none,\n      \"last_updated\": item.last_updated.isoformat()\n
        \                     if item is not none else none\n    },\n    \"attributes\":
        dict(item.attributes) if item is not none else {}\n  }] %}\n{% endfor %}\n{{
        ns.results }}"
  - variables:
      result: '{{ entity_info }}'
    enabled: true
  - stop: Return entity info
    response_variable: result
    enabled: true
  fields:
    input_entities:
      selector:
        entity:
          multiple: true
      default:
      - switch.ps_44_3_heater
      - switch.ps_6_6_heater
  alias: Attribute Trace
  description: "Returns information for one or more selected entities, including their
    name,\n  current state, integration details, timestamps, and all exposed state\n
    \ attributes. Accepts input_entities and returns a dictionary containing an\n
    \ entities list. Read-only; does not change entities or create alerts."
gbt_generic_semantic:
  alias: GBT Generic Semantic
  description: Turns entities into a short spoken status report via AI. Threshold
    helpers, and sensors watched by one, are expanded to source value and lower/upper
    limits. Returns {text, condition, thresholds}.
  fields:
    condition:
      name: Condition
      required: false
      selector:
        text:
    input_entities:
      description: Entity to describe for the ai
      name: Input Entities
      required: true
      selector:
        entity:
          multiple: true
  sequence:
  - alias: Describe the sensor, not the threshold helper
    note: Threshold helpers are swapped for the sensor they watch, so area, device
      and labels come from the real sensor. The threshold block is added back later.
    variables:
      describe_entities: '{% set ns = namespace(o=[]) %}{% for e in [input_entities]
        | flatten if e %}{% set entry = config_entry_id(e) %}{% set integ = config_entry_attr(entry,
        ''domain'') if entry else none %}{% set src = state_attr(e, ''entity_id'')
        if integ == ''threshold'' else none %}{% set ns.o = ns.o + [src if src else
        e] %}{% endfor %}{{ ns.o | unique | list }}'
  - action: pyscript.entity_info
    data:
      dedupe: 'true'
      entities: '{{ describe_entities }}'
      flatten_members: 'false'
    metadata: {}
    response_variable: entity_result
  - note: Adds integration domain to each item. Threshold helpers, or sensors a threshold
      helper watches, get a threshold block with source value and limits.
    variables:
      entities: "{% set ns = namespace(out=[]) %}\n{% for i in entity_result['items']
        %}\n  {% set entry = config_entry_id(i.entity_id) %}\n  {% set integ = config_entry_attr(entry,
        'domain') if entry else none %}\n  {% if integ == 'threshold' %}\n    {% set
        th = i.entity_id %}\n  {% else %}\n    {% set th = integration_entities('threshold')
        | select('is_state_attr', 'entity_id', i.entity_id) | first | default(none)
        %}\n  {% endif %}\n  {% set extra = {'integration': integ} %}\n  {% if th
        %}\n    {% set src = state_attr(th, 'entity_id') %}{% set al = states.alert_redux
        | selectattr('attributes.source_entity', 'eq', th) | list | first | default(none)
        %}{% set since = (al.attributes.firing_since if al else none) or states[th].last_changed
        %}{% set mins = (((now() | as_timestamp) - (since | as_timestamp)) / 60) |
        round(0) | int if state_attr(th, 'position') != 'in_range' else none %}\n
        \   {% set extra = dict(extra, threshold={\n      'helper': th,\n      'helper_name':
        state_attr(th, 'friendly_name'),\n      'source_entity': src,\n      'source_name':
        state_attr(src, 'friendly_name'),\n      'value': state_attr(th, 'sensor_value'),\n
        \     'unit': state_attr(src, 'unit_of_measurement'),\n      'type': state_attr(th,
        'type'),\n      'lower': state_attr(th, 'lower'),\n      'upper': state_attr(th,
        'upper'),\n      'hysteresis': state_attr(th, 'hysteresis'),\n      'position':
        state_attr(th, 'position'), 'minutes_out_of_range': mins}) %}\n  {% endif
        %}\n  {% set ns.out = ns.out + [dict(i, **extra)] %}\n{% endfor %}\n{{ ns.out
        }}"
  - alias: Trim what the AI sees
    note: 'Only name, state, unit, area, spot, device and label names go to the AI.
      A label named Spot: X becomes spot X, a place inside the area. Device names
      lose code tokens such as ps_44 or (ps_3) and hardware words such as power strip,
      so 55 gallon ps_44 becomes 55 gallon.'
    variables:
      ai_items: "{% set ns = namespace(out=[]) %}\n{% for e in entities %}\n  {% set
        dev = (e.device_name or '') | regex_replace(find='[^ ]*_[^ ]*', replace='')
        | regex_replace(find='[(][ ]*[)]', replace='') | regex_replace(find='power
        strip', replace='', ignorecase=True) | regex_replace(find='[ ]+', replace='
        ') | trim %}\n  {% set ids = ((e.entity_labels or []) + (e.device_labels or
        [])) | unique | list %}\n  {% set spot = ids | select('match', 'spot_') |
        map('label_name') | select | map('regex_replace', find='^ *spot *: *', replace='',
        ignorecase=True) | first | default(none) %}\n  {% set labels = ids | reject('match',
        'spot_') | map('label_name') | select | list %}\n  {% set item = {'name':
        e.name, 'state': e.state, 'unit': state_attr(e.entity_id, 'unit_of_measurement'),
        'area': e.area_name, 'spot': spot, 'device': dev or none, 'labels': labels}
        %}\n  {% if e.threshold is defined %}{% set item = dict(item, threshold=e.threshold)
        %}{% endif %}\n  {% set ns.out = ns.out + [item] %}\n{% endfor %}\n{{ ns.out
        }}"
  - action: ai_task.generate_data
    data:
      entity_id: ai_task.openai_ai_task
      instructions: 'Problem condition (may be empty):

        {{ condition | default('''', true) }}


        Entities (JSON):

        {{ ai_items | tojson }}


        Write a short, natural, speech-friendly report on these entities, to be read
        aloud.


        If a problem condition is given, open with it as an alert in plain words,
        then give the current values that back it up. If no condition is given, report
        current states neutrally with no alert wording.


        Name each thing the way a person in this home would say it. Start from its
        friendly name, then add only the context needed to make it clear: a meaningful
        device name, its spot, labels (such as aquarium), and the area. A spot is
        a place inside the area, so a light with spot Mirror in the Bathroom is the
        bathroom mirror light. Skip any name or label that looks like a code or ID
        (such as ps_44, a hex string or a model number), and never repeat a word that
        is already in the name. Fold that context into the name itself, as in the
        garage chest freezer, rather than adding a separate sentence about it. When
        several entities share a device, label or area, say that context once and
        list them under it, as in the garage freezer and fridge are both on. If two
        things would otherwise sound the same, use the device name to tell them apart,
        as in the upstairs bathroom fan and the downstairs bathroom fan, and once
        you do, use it for every one of them, never just one. Leave hardware words
        such as power strip, plug or socket out of device names. Group things that
        share a state and say that state once for the whole group, as in the garage
        freezer, fridge and dehumidifier are all on, and the porch light is off. If
        everything is in the same state, say it in one sentence. Mention a thing on
        its own only when its state differs from the rest. Never restate a state in
        another sentence. Round numbers the way a person would say them, to at most
        one decimal place.


        Entities with a "threshold" block have a threshold monitor. Never report a
        threshold monitor''s on/off state. Instead, give the source value with its
        unit and compare it to the limits using "position": "below" means under the
        lower limit, "above" means over the upper limit, "in_range" means within limits.
        Mention only the limit that matters.


        "Off" is not a problem by itself. Report unknown or unavailable states as
        such. Don''t assume everything is fine because no condition was given. Don''t
        invent causes, limits or statuses that aren''t in the data, and don''t add
        judgments such as running smoothly, working fine or healthy; just say the
        state.


        For a threshold block, the item is the sensor itself, so describe it by its
        name with its device and area, such as the reptile room temperature from the
        BTHome sensor in the library, and never mention the monitor or helper. State
        the value with its unit and whether it is within the range of lower to upper,
        or above the maximum or below the minimum. If minutes_out_of_range is 2 or
        more, say how long it has been out of range in natural units such as about
        20 minutes or about 2 hours. Return only the report text, with no heading,
        markdown or explanation.'
      task_name: Semantic State Report
    metadata: {}
    response_variable: result
  - variables:
      report:
        condition: '{{ condition | default('''', true) }}'
        text: '{{ result.data }}'
        thresholds: '{{ entities | selectattr(''threshold'', ''defined'') | map(attribute=''threshold'')
          | unique(attribute=''helper'') | list }}'
  - response_variable: report
    stop: Return generated report
critical_alert_semantic_entity_test:
  alias: Critical Alert — Semantic Entity References (TEST)
  description: Manual test for an Alert Redux generator. Returns semantic text and
    exact entity references; only creates a local test notification when requested.
    Does not fire alerts or send mobile critical notifications.
  mode: queued
  max: 5
  fields:
    generator_entity:
      name: Generator
      default: sensor.alert_redux_generator_test_label_wip
      selector:
        entity:
          domain: sensor
    input_entities:
      name: Override entity references
      description: Optional explicit subjects for testing; otherwise uses currently
        firing generated alerts.
      selector:
        entity:
          multiple: true
    create_notification:
      name: Create local test notification
      default: false
      selector:
        boolean:
  sequence:
  - variables:
      generator: '{{ generator_entity | default(''sensor.alert_redux_generator_test_label_wip'',true)
        }}'
  - variables:
      alert_ids: '{{ state_attr(generator,''alerts'') | default([],true) }}'
      all_targets: '{{ state_attr(generator,''targets'') | default([],true) }}'
  - variables:
      firing_alerts: '{{ expand(alert_ids) | selectattr(''state'',''in'',[''active'',''ack''])
        | map(attribute=''entity_id'') | list }}'
  - variables:
      subjects: '{{ input_entities | default(expand(firing_alerts) | map(attribute=''attributes.subject_entity'')
        | select(''string'') | unique | list, true) }}'
      semantic_result: {}
      fallback: '{% if not has_value(generator) %}Generator data is unavailable; no
        conclusion about equipment health can be made.{% elif firing_alerts | count
        == 0 %}No currently firing alerts were found in this generator.{% else %}Currently
        firing alert subjects: {{ subjects | join('', '') }}.{% endif %}'
  - if:
    - condition: template
      value_template: '{{ subjects | count > 0 }}'
    then:
    - action: script.gbt_generic_semantic
      data:
        input_entities: '{{ subjects }}'
        condition: '{% if input_entities | default([],true) | count > 0 %}Manual test
          of these entities. Describe their current states without inferring a fault.{%
          else %}These entities are subjects of currently firing Alert Redux alerts.
          {% for id in firing_alerts %}{{ state_attr(id,''message'') | default(id,true)
          }} {% endfor %}Do not infer a physical cause from the alert name alone.{%
          endif %}'
      response_variable: semantic_result
      continue_on_error: true
  - variables:
      report: '{{ semantic_result.text | default(fallback,true) }}'
      references: '{% set ns=namespace(rows=[]) %}{% for id in subjects %}{% set ns.rows
        = ns.rows + [dict(entity_id=id,name=state_attr(id,''friendly_name'') | default(id,true),state=states(id),area=area_name(id),labels=labels(id))]
        %}{% endfor %}{{ ns.rows }}'
      reference_text: '{% for id in subjects %}

        - {{ state_attr(id,''friendly_name'') | default(id,true) }} — `{{ id }}` ({{
        states(id) }}){% endfor %}'
  - variables:
      result:
        message: '{{ report }}'
        entities: '{{ subjects }}'
        references: '{{ references }}'
        generator: '{{ generator }}'
        alerts: '{{ firing_alerts }}'
        all_targets: '{{ all_targets }}'
  - if:
    - condition: template
      value_template: '{{ create_notification | default(false) | bool }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: critical_alert_semantic_entity_test
        title: TEST — Critical alert with entity references
        message: '{{ report }}


          Entity references:

          {{ reference_text }}'
  - stop: Return semantic report and exact entity references
    response_variable: result
aquarium_selector_v2_ui:
  alias: Aquarium Selector v2 UI
  description: UI copy of the YAML script, on Set Entity State v3. CO2 steps target
    switch.ps_6_2_co2 (the YAML pointed at a missing switch.20g_rack_co2).
  fields:
    aquarium_picker:
      name: Aquarium Picker
      required: true
      selector:
        select:
          multiple: true
          options:
          - 120g
          - 55g
          - 10g Male
          - 20g Long
          - 10g Upper
          - Quarantine
    aquarium_clean_notes:
      name: Aquarium Clean Notes
      selector:
        select:
          custom_value: true
          multiple: true
          options:
          - Water Change (Vacuum)
          - Trim Plants
          - Remove algae
          - Deep Clean
          - Clean Filter
          - Quick water Change (no vacuum)
    delay_minutes:
      default: 45
      name: Delay Minutes
      required: true
      selector:
        number:
          max: 245
          min: 15
    end_notification_timer:
      default: 5
      description: this cannot be greater than the total time.
      name: End Notification Timer
      required: false
      selector:
        number:
          max: 25
          min: 1
          step: 1
  mode: parallel
  sequence:
  - alias: CONST ENUM VARIABLES
    variables:
      co2_list:
      - switch.10g_m_pumps_heaters
      - switch.20g_pumps_heaters
      lookup:
        10g Male: switch.10g_m_pumps_heaters
        10g Upper: switch.20g_pumps_heaters
        120g: switch.120g_pumps_heaters
        20g Long: switch.20g_pumps_heaters
        55g: switch.55g_pumps_heaters
        Quarantine: switch.20g_pumps_heaters
  - variables:
      aq_list: '{{state_attr(''input_select.aquarium'',''options'')}}'
      selected_value: '{{aquarium_picker}}'
      selected_entities: "{%- set ns = namespace(entities=[]) %}\n  {%- for value
        in selected_value %}\n  {%- set ns.entities = ns.entities + [lookup[value]]
        %}\n{%- endfor %}{{- ns.entities }}"
      do_notification: '{{ bool( end_notification_timer is defined , false )  and
        bool(( end_notification_timer | int(999)  < delay_minutes | int(999) ),false)
        }}'
      first_delay: '{% if do_notification %}{{ ( delay_minutes | int(999) - end_notification_timer|int(999)
        )| int(999) }}{% else %}{{ delay_minutes | int(999) }} {% endif %}'
      second_delay: '{% if do_notification %}{{  end_notification_timer|int(999) }}{%
        else %}{{ 0 | int(999) }} {% endif %}'
      do_co2: '{{ selected_entities | select(''in'', co2_list) | list | length > 0
        }}'
      friendly_names: "{%- set ns = namespace(entities=[]) %}\n  {%- for value in
        selected_value %}\n  {%- set ns.entities = ns.entities + [ state_attr( lookup[value],'friendly_name')]
        %}\n{%- endfor %}{{- ns.entities | join(',')}}"
      message: '"{{ second_delay |int(999) }} minute warning! {{ friendly_names  }}
        have been off for {{ first_delay |int(999) }} and will be turning back on
        in {{ second_delay |int(999) }} minutes!!"

        '
  - enabled: true
    sequence:
    - action: script.set_state_switch_light_test_version
      alias: Turn off pumps
      data:
        manual_state: 'off'
        mode: manual
        target_entities: '{{ selected_entities }}'
      enabled: true
    - alias: Turn off C02 if needed
      enabled: true
      if:
      - condition: template
        value_template: '{{ bool( do_co2 ,false) and bool(states(''schedule.aquarium_co2_schedule'',false
          ))  }}'
      then:
      - action: script.set_state_switch_light_test_version
        data:
          manual_state: 'off'
          mode: manual
          target_entities:
          - switch.ps_6_2_co2
    - alias: first delay
      delay:
        hours: 0
        milliseconds: 0
        minutes: '{{ first_delay |int }}'
        seconds: 0
      enabled: true
    - alias: if do notification
      enabled: true
      if:
      - condition: template
        value_template: '{{ bool(do_notification ,false)}}'
      then:
      - action: script.notification_dispatcher
        data:
          alexa_sound: amzn_sfx_doorbell_chime_01
          alexa_volume: Maximum Volume
          bool_critical: 'OFF'
          email_targets:
          - gbtunney@mac.com
          message: '{{message}}'
          notification_channel:
          - alexa
          sms_targets:
          - 7188138156@mms.att.net
          sound: default
        enabled: true
    - alias: second delay
      delay:
        hours: 0
        milliseconds: 0
        minutes: '{{ second_delay|int }}'
        seconds: 0
      enabled: true
    - action: script.set_state_switch_light_test_version
      alias: Turn ON pumps
      data:
        manual_state: 'on'
        mode: manual
        target_entities: '{{ selected_entities }}'
      enabled: true
    - alias: Turn ON C02 if needed and  if scheduled
      enabled: true
      if:
      - condition: template
        value_template: '{{ bool(do_co2 ,false) and bool(states(''schedule.aquarium_co2_schedule'',false
          )) }}'
      then:
      - action: script.set_state_switch_light_test_version
        alias: Turn on CO2 if scheduled
        data:
          mode: mirror
          reference_entity: schedule.aquarium_co2_schedule
          target_entities:
          - switch.ps_6_2_co2
    - alias: 'Do logbook entries if filled in '
      if:
      - condition: template
        value_template: '{{ aquarium_clean_notes is defined }} '
      then:
      - repeat:
          for_each: '{{selected_entities}}'
          sequence:
          - action: logbook.log
            data:
              entity_id: '{{ repeat.item }}'
              message: 'Maintenance was logged: {{aquarium_clean_notes | join('','')
                }}'
              name: Aquarium Maintenance
