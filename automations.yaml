- id: '1784938280801'
  alias: Bambu Status Updates
  description: Log Bambu print progress at selected milestones
  triggers:
  - trigger: state
    entity_id: sensor.bambu_printer_mechlab_print_progress
    enabled: false
  - trigger: state
    entity_id:
    - input_boolean.dummy_button
    to:
  conditions:
  - condition: state
    entity_id: sensor.bambu_printer_mechlab_print_status
    state: running
    enabled: false
  - condition: state
    entity_id: input_boolean.dummy_button
    state:
    - 'on'
  actions:
  - variables:
      progress_milestones:
      - 50
      - 60
      - 70
      - 80
      - 95
      - 98
      - 99
      ordered_milestones: "{{ progress_milestones\n    | map('int')\n    | select('gt',
        0)\n    | select('le', 100)\n    | sort(reverse=true)}}"
      print_progress_value: '{{ states(''sensor.bambu_printer_mechlab_bambu_dummy_progress'')
        | int(0) }}'
      test_list: '{{ ordered_milestones | list }}'
  - repeat:
      for_each: '{{ test_list }}'
      sequence:
      - variables:
          testy: '{{repeat.item }}'
          current_milestone: '{{ repeat.item | int(0) }}'
          curr_progress_value: '{{print_progress_value| int(0)}}'
          match_bool: '{{  ( curr_progress_value > current_milestone ) }}'
          current_index: '{{repeat.index}}'
          message: PRINT INDEX IS {{current_index }} Print is {{ print_progress_value
            | int(0) }}% complete. Crossed the {{ current_milestone | int(0) }}% milestone.
            Printer status is {{ states('sensor.bambu_printer_mechlab_print_status')
            }}.
      - if:
        - condition: template
          value_template: '{{ match_bool  }}'
        then:
        - action: logbook.log
          metadata: {}
          data:
            name: LogStatus
            message: '{{ message }}'
            entity_id: sensor.bambu_printer_mechlab_bambu_dummy_progress
        - action: script.notification_dispatcher
          metadata: {}
          data:
            message: Print is {{ print_progress_value | int(0) }}% complete. Crossed
              the {{ current_milestone | int(0) }}% milestone. Printer status is {{
              states('sensor.bambu_printer_mechlab_print_status') }}.
            notification_channel:
            - iPad
            - iPhone
            - persistant
            sound: default
            alexa_sound: amzn_sfx_rooster_crow_01
        else:
        - action: logbook.log
          metadata: {}
          data:
            name: LogStatus
            message: BYPASSING EVERYTHING!!!!!!!!! {{ message }}
        - stop: Matching Bambu progress milestone was logged DEBUG
          enabled: true
          response_variable: current_index
  mode: queued
  max: 5
- id: '1791615435128'
  alias: MS1 Motion Sensor Test
  description: Debug/testing automation for MS1. Motion detected turns the LED strip
    red; motion cleared turns it green so the sensor occupancy cycle is obvious while
    testing.
  triggers:
  - trigger: motion.detected
    target:
      entity_id: binary_sensor.ms1_motion
    options:
      behavior: each
      for: 00:00:00
    id: motion_detected
  - trigger: motion.cleared
    target:
      entity_id: binary_sensor.ms1_motion
    options:
      for: 00:00:00
    id: motion_cleared
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion_detected
      sequence:
      - action: light.set_color
        target:
          entity_id: light.led_strip_color
        data:
          rgb_color:
          - 255
          - 0
          - 0
          brightness_pct: 100
          transition: 0.2
    - conditions:
      - condition: trigger
        id: motion_cleared
      sequence:
      - action: light.set_color
        target:
          entity_id: light.led_strip_color
        data:
          rgb_color:
          - 0
          - 255
          - 60
          brightness_pct: 35
          transition: 0.5
      - action: script.toggle
        metadata: {}
        target:
          entity_id: script.notification_dispatcher
        data: {}
  mode: restart
- id: '1792467048039'
