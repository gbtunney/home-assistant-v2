- id: '1735089085485'
  alias: 'Sensor: Home Assistant Last Started'
  description: 'On every start: stamps HA Last Started (feeds the uptime badge), then
    after 1 minute re-runs every automation labeled Schedule so anything that changed
    during the reboot gets set right.'
  triggers:
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - action: input_datetime.set_datetime
    data:
      timestamp: '{{float(as_timestamp(now()),0)}}'
    metadata: {}
    target:
      entity_id: input_datetime.ha_last_start
  - delay:
      minutes: 1
  - action: automation.trigger
    data:
      skip_condition: false
    target:
      label_id:
      - schedule
  mode: single
- id: '1744261059099'
  alias: Reptile Lighting Schedule UI
  description: 'Reptile lights follow the Reptile Lighting Schedule sensor (adjusted
    daylight) via Set Entity State v3. Re-synced after every restart by Sensor: Home
    Assistant Last Started.'
  triggers:
  - entity_id:
    - binary_sensor.reptile_lighting_schedule
    to:
    - 'on'
    - 'off'
    trigger: state
  conditions:
  - condition: state
    entity_id: binary_sensor.reptile_lighting_schedule
    state:
    - 'on'
    - 'off'
  actions:
  - action: script.set_state_switch_light_test_version
    data:
      mode: mirror
      reference_entity: binary_sensor.reptile_lighting_schedule
      target_entities:
      - light.reptile_lights
  mode: queued
